<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手搖珍奶職人模擬器 - Boba Master</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        .bouncing { animation: bounce 0.5s infinite alternate; }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }
    </style>
</head>
<body class="bg-amber-50 text-stone-800 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- 頂部標題與狀態列 -->
    <header class="w-full max-w-2xl bg-white shadow-md rounded-2xl p-4 mb-4 flex flex-col md:flex-row justify-between items-center border border-amber-100">
        <div class="flex items-center space-x-3 mb-2 md:mb-0">
            <span class="text-3xl">🧋</span>
            <div>
                <h1 class="text-xl font-black text-amber-900">手搖珍奶職人模擬器</h1>
                <p class="text-xs text-amber-600 font-medium">Boba Master Simulator v2.0</p>
            </div>
        </div>
        <div class="flex space-x-4 bg-amber-50 px-4 py-2 rounded-xl border border-amber-200">
            <div class="text-center">
                <p class="text-xs text-amber-700 font-bold">營業額</p>
                <p id="money" class="text-lg font-black text-amber-900">$0</p>
            </div>
            <div class="border-r border-amber-200"></div>
            <div class="text-center">
                <p class="text-xs text-amber-700 font-bold">平均評價</p>
                <p id="rating" class="text-lg font-black text-amber-900">⭐⭐⭐⭐⭐</p>
            </div>
        </div>
    </header>

    <!-- 主遊戲區 -->
    <main class="w-full max-w-2xl grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        
        <!-- 左側：顧客與訂單 -->
        <div class="bg-white shadow-md rounded-2xl p-5 border border-amber-100 flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold text-stone-500 uppercase tracking-wider">目前顧客</h2>
                    <span id="customer-timer" class="text-xs bg-red-100 text-red-600 font-bold px-2 py-0.5 rounded-full">倒數中: 30s</span>
                </div>
                <div id="customer-box" class="bg-amber-50/50 rounded-xl p-4 border border-amber-200 text-center mb-4">
                    <div id="customer-avatar" class="text-4xl mb-2 bouncing">🧑‍💼</div>
                    <p id="customer-dialog" class="text-sm font-bold text-amber-900">「點擊下方按鈕迎接第一位客人！」</p>
                </div>
                <div class="bg-stone-50 rounded-xl p-3 border border-stone-200">
                    <p class="text-xs font-bold text-stone-500 mb-1">訂單需求明細：</p>
                    <ul id="order-details" class="text-sm text-stone-700 space-y-1">
                        <li>- 尚無訂單</li>
                    </ul>
                </div>
            </div>
            <div class="mt-4 flex space-x-2">
                <button onclick="nextCustomer()" id="next-btn" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 px-4 rounded-xl shadow transition transform active:scale-95 text-sm">
                    🔔 迎接下一位客人
                </button>
                <button onclick="serveDrink()" id="serve-btn" disabled class="flex-1 bg-stone-300 text-stone-500 font-bold py-2.5 px-4 rounded-xl cursor-not-allowed transition text-sm">
                    ✨ 出餐給客人！
                </button>
            </div>
        </div>

        <!-- 右側：製作工作台預覽 -->
        <div class="bg-white shadow-md rounded-2xl p-5 border border-amber-100 flex flex-col items-center justify-between">
            <div class="w-full">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold text-stone-500 uppercase tracking-wider">工作台預覽</h2>
                    <button onclick="resetCup()" class="text-xs text-stone-400 hover:text-red-500 underline">重新製作</button>
                </div>
                <!-- 珍奶杯視覺顯示 -->
                <div class="relative w-32 h-44 mx-auto bg-amber-100/30 border-4 border-t-0 border-stone-300 rounded-b-3xl flex flex-col justify-end items-center overflow-hidden shadow-inner">
                    <!-- 配料沉淀區 -->
                    <div id="cup-toppings" class="absolute bottom-1 w-24 flex flex-wrap justify-center items-end gap-0.5 z-10"></div>
                    <!-- 茶水液體 -->
                    <div id="cup-liquid" class="w-full h-0 transition-all duration-500 z-0 opacity-80"></div>
                    <!-- 杯口裝飾 -->
                    <div class="absolute top-0 w-36 h-2 bg-stone-300 rounded-full"></div>
                </div>
            </div>
            <div id="cup-status" class="mt-3 text-xs text-stone-500 font-medium text-center">
                杯子目前是空的，請加入茶底
            </div>
        </div>
    </main>

    <!-- 原料控制台 -->
    <section class="w-full max-w-2xl bg-white shadow-md rounded-2xl p-5 border border-amber-100 mb-4">
        <h2 class="text-sm font-bold text-stone-500 uppercase tracking-wider mb-3">原料控制台</h2>
        
        <!-- 1. 茶底 -->
        <div class="mb-3">
            <label class="text-xs font-bold text-amber-800 block mb-1">1. 選擇茶底 (Tea Base)</label>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="selectTea('紅茶', '#b45309')" class="bg-amber-100 hover:bg-amber-200 border border-amber-300 font-bold py-1.5 px-3 rounded-lg text-xs transition">🔴 紅茶</button>
                <button onclick="selectTea('綠茶', '#15803d')" class="bg-emerald-100 hover:bg-emerald-200 border border-emerald-300 font-bold py-1.5 px-3 rounded-lg text-xs transition">🟢 綠茶</button>
                <button onclick="selectTea('烏龍茶', '#78350f')" class="bg-yellow-900/20 hover:bg-yellow-900/30 border border-yellow-900/30 font-bold py-1.5 px-3 rounded-lg text-xs transition">🟤 烏龍茶</button>
            </div>
        </div>

        <!-- 2. 配料 -->
        <div class="mb-3">
            <label class="text-xs font-bold text-amber-800 block mb-1">2. 添加配料 (Toppings)</label>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="addTopping('珍珠', '⚫')" class="bg-stone-100 hover:bg-stone-200 border border-stone-300 font-bold py-1.5 px-3 rounded-lg text-xs transition">🧋 珍珠</button>
                <button onclick="addTopping('椰果', '🧊')" class="bg-cyan-50 hover:bg-cyan-100 border border-cyan-200 font-bold py-1.5 px-3 rounded-lg text-xs transition">🥥 椰果</button>
                <button onclick="addTopping('布丁', '🍮')" class="bg-orange-100 hover:bg-orange-200 border border-orange-300 font-bold py-1.5 px-3 rounded-lg text-xs transition">🍮 布丁</button>
            </div>
        </div>

        <!-- 3. 冰塊與甜度 -->
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="text-xs font-bold text-amber-800 block mb-1">3. 冰塊 (Ice)</label>
                <select id="ice-select" class="w-full bg-stone-50 border border-stone-300 rounded-lg p-1.5 text-xs font-medium">
                    <option value="正常冰">正常冰</option>
                    <option value="少冰" selected>少冰</option>
                    <option value="去冰">去冰</option>
                </select>
            </div>
            <div>
                <label class="text-xs font-bold text-amber-800 block mb-1">4. 甜度 (Sugar)</label>
                <select id="sugar-select" class="w-full bg-stone-50 border border-stone-300 rounded-lg p-1.5 text-xs font-medium">
                    <option value="正常糖">正常糖</option>
                    <option value="半糖">半糖</option>
                    <option value="微糖" selected>微糖 (30%)</option>
                    <option value="無糖">無糖</option>
                </select>
            </div>
        </div>
    </section>

    <footer class="text-xs text-stone-400 font-medium">
        ✨ 專為 VS Code 與 GitHub Pages 設計的純前端互動網頁
    </footer>

    <!-- 遊戲邏輯 Script -->
    <script>
        let money = 0;
        let totalScore = 5.0;
        let servedCount = 0;
        let currentOrder = null;

        // 玩家當前製作的飲料狀態
        let playerDrink = {
            tea: null,
            teaColor: '',
            toppings: [],
            ice: '少冰',
            sugar: '微糖'
        };

        const avatars = ['🧑‍💼', '👩‍🎓', '👨‍💻', '👩‍🎨', '👵', '🧑‍🎤'];
        const names = ['上班族小陳', '大學生小美', '工程師杰哥', '藝術家Amy', '鄰居阿嬤', '搖滾樂手Leo'];

        function nextCustomer() {
            // 隨機生成訂單
            const teas = ['紅茶', '綠茶', '烏龍茶'];
            const availableToppings = ['珍珠', '椰果', '布丁'];
            
            const randomTea = teas[Math.floor(Math.random() * teas.length)];
            const randomTopping = Math.random() > 0.3 ? availableToppings[Math.floor(Math.random() * availableToppings.length)] : null;
            const randomIce = ['正常冰', '少冰', '去冰'][Math.floor(Math.random() * 3)];
            const randomSugar = ['正常糖', '半糖', '微糖', '無糖'][Math.floor(Math.random() * 4)];

            currentOrder = {
                name: names[Math.floor(Math.random() * names.length)],
                avatar: avatars[Math.floor(Math.random() * avatars.length)],
                tea: randomTea,
                topping: randomTopping,
                ice: randomIce,
                sugar: randomSugar
            };

            // 更新介面
            document.getElementById('customer-avatar').innerText = currentOrder.avatar;
            document.getElementById('customer-dialog').innerText = `「老闆！我要一杯 ${currentOrder.tea}，加 ${currentOrder.topping || '不加配料'}，${currentOrder.ice}、${currentOrder.sugar}！謝謝！」`;
            
            let detailsHtml = `<li>- 茶底：<b>${currentOrder.tea}</b></li>`;
            detailsHtml += `<li>- 配料：<b>${currentOrder.topping || '無'}</b></li>`;
            detailsHtml += `<li>- 冰塊/甜度：<b>${currentOrder.ice} / ${currentOrder.sugar}</b></li>`;
            document.getElementById('order-details').innerHTML = detailsHtml;

            // 啟用出餐按鈕，停用迎接按鈕
            document.getElementById('serve-btn').disabled = false;
            document.getElementById('serve-btn').className = "flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-xl shadow transition transform active:scale-95 text-sm cursor-pointer";
            document.getElementById('next-btn').disabled = true;
            document.getElementById('next-btn').className = "flex-1 bg-stone-300 text-stone-500 font-bold py-2.5 px-4 rounded-xl cursor-not-allowed transition text-sm";
            
            resetCup();
        }

        function selectTea(teaName, colorHex) {
            playerDrink.tea = teaName;
            playerDrink.teaColor = colorHex;
            
            const liquid = document.getElementById('cup-liquid');
            liquid.style.backgroundColor = colorHex;
            liquid.style.height = '75%';
            
            updateCupStatus();
        }

        function addTopping(toppingName, emoji) {
            if (!playerDrink.tea) {
                alert('請先選擇茶底再加配料喔！');
                return;
            }
            if (playerDrink.toppings.length >= 3) {
                alert('杯子滿囉！最多加 3 樣配料！');
                return;
            }
            playerDrink.toppings.push(toppingName);
            
            const toppingsBox = document.getElementById('cup-toppings');
            const span = document.createElement('span');
            span.innerText = emoji;
            span.className = "text-xl drop-shadow";
            toppingsBox.appendChild(span);
            
            updateCupStatus();
        }

        function resetCup() {
            playerDrink = { tea: null, teaColor: '', toppings: [], ice: '少冰', sugar: '微糖' };
            document.getElementById('cup-liquid').style.height = '0%';
            document.getElementById('cup-liquid').style.backgroundColor = 'transparent';
            document.getElementById('cup-toppings.innerHTML = ""') // Fix innerHTML clear
            document.getElementById('cup-toppings').innerHTML = '';
            updateCupStatus();
        }

        function updateCupStatus() {
            let statusText = playerDrink.tea ? `已選擇：${playerDrink.tea}` : '杯子是空的';
            if (playerDrink.toppings.length > 0) {
                statusText += ` + 配料(${playerDrink.toppings.join(', ')})`;
            }
            document.getElementById('cup-status').innerText = statusText;
        }

        function serveDrink() {
            if (!currentOrder) return;

            // 取得選取的冰塊與甜度
            playerDrink.ice = document.getElementById('ice-select').value;
            playerDrink.sugar = document.getElementById('sugar-select').value;

            // 簡易評分邏輯
            let score = 5;
            let feedback = "完美！客人非常滿意！⭐⭐⭐⭐⭐";

            if (playerDrink.tea !== currentOrder.tea) {
                score -= 2;
                feedback = "哎呀！茶底泡錯囉！⭐";
            }
            if (JSON.stringify(playerDrink.toppings.sort()) !== JSON.stringify([currentOrder.topping].filter(Boolean).sort())) {
                score -= 1.5;
                feedback = "配料好像跟客人點的不太一樣...⭐⭐⭐";
            }
            if (playerDrink.ice !== currentOrder.ice || playerDrink.sugar !== currentOrder.sugar) {
                score -= 0.5;
                feedback = "冰塊或甜度跟客人的要求有落差！⭐⭐⭐⭐";
            }

            if (score < 1) score = 1;

            // 結算金幣與評分
            let earned = Math.round(score * 20);
            money += earned;
            servedCount++;
            totalScore = ((totalScore * (servedCount - 1) + score) / servedCount).toFixed(1);

            document.getElementById('money').innerText = `$${money}`;
            document.getElementById('rating').innerText = `⭐ ${totalScore}`;
            document.getElementById('customer-dialog').innerText = `「${feedback} (獲得 $${earned})」`;

            // 恢復迎接按鈕
            document.getElementById('serve-btn').disabled = true;
            document.getElementById('serve-btn').className = "flex-1 bg-stone-300 text-stone-500 font-bold py-2.5 px-4 rounded-xl cursor-not-allowed transition text-sm";
            document.getElementById('next-btn').disabled = false;
            document.getElementById('next-btn').className = "flex-1 bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 px-4 rounded-xl shadow transition transform active:scale-95 text-sm cursor-pointer";
            
            currentOrder = null;
        }
    </script>
</body>
</html>
